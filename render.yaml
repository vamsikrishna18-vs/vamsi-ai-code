# Render Blueprint for Kuracha Vamsi Krishna — Portfolio
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: vamsi-krishna-portfolio
    runtime: node
    plan: free
    region: singapore
    buildCommand: NITRO_PRESET=node-server npm install && NITRO_PRESET=node-server npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: node-server
